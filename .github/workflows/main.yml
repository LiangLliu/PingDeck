name: Main

# Tier 2 of 4 (docs/development.md §2.4): runs on every push to the default branch.
# Pure-Rust production release smoke on macOS & Linux + full macOS workspace nextest + canonical Linux cargo test.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  smoke:
    name: Release smoke (${{ matrix.os }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
          smoke: "true"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-smoke
      - name: Build pure-Rust GPUI release binary
        run: cargo build --release -p pingdeck-gpui --locked
      - uses: ./.github/actions/run-smoke
        with:
          binary: target/release/pingdeck
          artifact-suffix: main-${{ matrix.os }}

  rust-macos-full:
    name: Rust full suite (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: nextest
          tools: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: main-macos-junit
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  rust-canonical:
    name: Canonical cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
          bubblewrap: "true"
      - run: python3 --version
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: canonical-test
      - run: cargo test --workspace --locked
