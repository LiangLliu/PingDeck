name: Nightly

# Tier 3 of 4 (docs/development.md §2.4): full cross-OS tests (incl. ignored + release 10 MiB budgets),
# release GPUI native widget stress bench, and supply-chain audits.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-nightly:
    name: Rust full + ignored + release 10 MiB (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
          bubblewrap: "true"
      - run: python3 --version
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: nightly-nextest
          tools: cargo-nextest
      - name: Run full workspace nextest
        run: cargo nextest run --workspace --locked --profile ci
      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Run ignored tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --locked --profile ci --run-ignored only --no-tests=warn
      - name: Run release 10 MiB response formatting budget test
        if: ${{ !cancelled() }}
        run: cargo test -p pingdeck-response --release --locked -- --ignored ten_mib --nocapture
      - name: Run release GPUI native 10 MiB Rope & 10k table bench
        if: ${{ !cancelled() }}
        run: cargo test -p pingdeck-gpui --release --features test-support --locked -- --test-threads=2 --nocapture

  audit-rust:
    name: Rust dependency & dead-dep audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: audit-rust
          tools: cargo-audit,cargo-machete
      - name: cargo audit
        if: ${{ !cancelled() }}
        run: cargo audit
      - name: cargo machete
        if: ${{ !cancelled() }}
        run: cargo machete
