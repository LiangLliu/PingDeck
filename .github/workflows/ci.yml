name: CI

# Unified pure-Rust CI pipeline (docs/development.md §2.4):
# - PR: path-filtered static checks, cargo-deny, dual-OS clippy, Linux full + macOS targeted nextest,
#   and dual-OS headless GPUI UI tests.
# - Push to main/master: full dual-OS clippy, full dual-OS nextest, dual-OS headless GPUI UI tests,
#   and dual-OS release binary smoke tests.
# - Nightly schedule (or manual `run_nightly`): additionally runs ignored tests, release 10 MiB
#   budgets/benchmarks, cargo-audit, and cargo-machete.
# - Release packaging & GitHub Releases live separately in `.github/workflows/release.yml`.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_nightly:
        description: Also run nightly ignored tests, release 10 MiB budgets, and cargo-audit/machete
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.resolve.outputs.docs }}
      assets: ${{ steps.resolve.outputs.assets }}
      rust: ${{ steps.resolve.outputs.rust }}
      smoke: ${{ steps.resolve.outputs.smoke }}
      nightly: ${{ steps.resolve.outputs.nightly }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        if: github.event_name == 'pull_request'
      - name: Classify pull request changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - 'xtask/**'
              - 'crates/spanbay-agent/src/agent/limits.rs'
            assets:
              - 'tokens/**'
              - 'locales/**'
              - 'assets/**'
              - 'fixtures/**'
              - '.github/**'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - 'about.*'
              - '.config/nextest.toml'
              - '.cargo/**'
              - 'xtask/**'
              - 'crates/**'
              - 'tokens/**'
              - 'locales/**'
              - 'fixtures/**'
              - 'scripts/**'
              - '.github/**'
      - name: Resolve final flags
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "assets=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
            echo "assets=${{ steps.filter.outputs.assets }}" >> "$GITHUB_OUTPUT"
            echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.run_nightly }}" = "true" ]; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          fi

  fast-checks:
    name: Fast static & architectural checks
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust (xtask & fmt)
        uses: ./.github/actions/setup-rust
        with:
          cache-key: xtask
      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Check manifest versions (xtask)
        run: cargo xtask check-version
      - name: Check 4-layer UI/core isolation (xtask)
        if: needs.changes.outputs.rust == 'true'
        run: cargo xtask check-arch
      - name: Check bilingual locales parity & rules (xtask)
        if: needs.changes.outputs.assets == 'true' || needs.changes.outputs.rust == 'true'
        run: cargo xtask check-i18n
      - name: Check OKLCH design tokens gamut & WCAG contrast (xtask)
        if: needs.changes.outputs.assets == 'true' || needs.changes.outputs.rust == 'true'
        run: cargo xtask check-tokens
      - name: Check docs links, limits & style (xtask)
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
        run: cargo xtask docs
      - name: Run xtask self-tests
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
        run: cargo test -p xtask --locked

  supply-chain:
    name: Supply-chain & license audit
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust dependency policy (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
      - name: Set up Rust (nightly audit tools)
        if: needs.changes.outputs.nightly == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: audit-rust
          tools: cargo-audit,cargo-machete
      - name: RustSec advisory audit (cargo-audit)
        if: needs.changes.outputs.nightly == 'true' && !cancelled()
        run: cargo audit
      - name: Unused dependency check (cargo-machete)
        if: needs.changes.outputs.nightly == 'true' && !cancelled()
        run: cargo machete

  rust-clippy:
    name: Rust clippy (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - name: Workspace clippy (all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: GPUI UI test-support clippy
        run: cargo clippy -p spanbay-gpui --features test-support --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bubblewrap: "true"
            pr_nextest: --workspace
          - os: macos-latest
            bubblewrap: "false"
            pr_nextest: -p spanbay-agent -p spanbay-base -p spanbay-executor -p spanbay-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
          bubblewrap: ${{ matrix.bubblewrap }}
      - name: Verify python3 for MCP stdio tests
        run: python3 --version
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: nextest
          tools: cargo-nextest
      - name: Run cargo-nextest
        shell: bash
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NEXTEST: ${{ matrix.pr_nextest }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = "true" ]; then
            cargo nextest run --locked --profile ci $PR_NEXTEST
          else
            cargo nextest run --locked --profile ci --workspace
          fi
      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Run ignored tests (nightly)
        if: needs.changes.outputs.nightly == 'true' && !cancelled()
        run: cargo nextest run --workspace --locked --profile ci --run-ignored only --no-tests=warn
      - name: Run release 10 MiB response formatting budget (nightly)
        if: needs.changes.outputs.nightly == 'true' && !cancelled()
        run: cargo test -p spanbay-response --release --locked -- --ignored ten_mib --nocapture
      - name: Run release GPUI native 10 MiB Rope & 10k table bench (nightly)
        if: needs.changes.outputs.nightly == 'true' && !cancelled()
        run: cargo test -p spanbay-gpui --release --features test-support --locked -- --test-threads=2 --nocapture

  gpui-ui-tests:
    name: Headless GPUI UI tests (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.assets == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: gpui-ui-tests
      - name: Run headless GPUI integration suite
        run: cargo test -p spanbay-gpui --features test-support --locked -- --test-threads=2

  release-smoke:
    name: Release smoke (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.smoke == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpui: "true"
          smoke: "true"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-smoke
      - name: Build pure-Rust GPUI release binary
        run: cargo build --release -p spanbay-gpui --locked
      - uses: ./.github/actions/run-smoke
        with:
          binary: target/release/spanbay
          artifact-suffix: ci-${{ matrix.os }}

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - fast-checks
      - supply-chain
      - rust-clippy
      - rust-tests
      - gpui-ui-tests
      - release-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all upstream jobs passed or were legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 -c '
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          print("Job results:", results)
          bad = [r for r in results if r not in ("success", "skipped")]
          if bad:
              print("CI Gate failed; non-passing results:", bad, file=sys.stderr)
              sys.exit(1)
          '
