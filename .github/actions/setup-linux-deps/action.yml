name: Install Linux dependencies
description: Install GPUI (X11/Wayland/Vulkan/Fontconfig/XKB), bubblewrap sandbox, and smoke Xvfb dependencies on Linux runners.

inputs:
  gpui:
    description: Install GPUI native graphics, windowing, and font dependencies.
    required: false
    default: "true"
  bubblewrap:
    description: Install and probe bubblewrap (enables unprivileged userns on Ubuntu 24.04).
    required: false
    default: "false"
  smoke:
    description: Install sqlite3, xvfb, openbox, xdotool, and x11-utils for release smoke runs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install system packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        pkgs=()
        if [ "${{ inputs.gpui }}" = "true" ]; then
          pkgs+=(
            pkg-config
            libx11-dev
            libx11-xcb-dev
            libxcb1-dev
            libxcb-render0-dev
            libxcb-shape0-dev
            libxcb-xfixes0-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
            libwayland-dev
            libvulkan-dev
            libfontconfig1-dev
            libfreetype6-dev
            libssl-dev
          )
        fi
        if [ "${{ inputs.bubblewrap }}" = "true" ]; then
          pkgs+=(bubblewrap)
        fi
        if [ "${{ inputs.smoke }}" = "true" ]; then
          pkgs+=(
            sqlite3
            xvfb
            openbox
            xdotool
            x11-utils
            libvulkan1
            mesa-vulkan-drivers
            libegl1
            libgl1
            libgl1-mesa-dri
            vulkan-tools
          )
        fi
        if [ "${#pkgs[@]}" -gt 0 ]; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"
        fi

    # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bubblewrap needs them.
    # Probing fails loudly here instead of silently letting agent tests skip the sandbox path.
    - name: Enable and probe bubblewrap (Linux)
      if: runner.os == 'Linux' && inputs.bubblewrap == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        bwrap --ro-bind / / --dev /dev --unshare-all --die-with-parent true
