# cargo-about 0.9.3: Rust licence notices shipped in assets/licenses/rust.txt. Regenerate after Cargo.lock changes:
#   cargo about generate --frozen --fail -o assets/licenses/rust.txt about.hbs
# `--frozen` keeps it offline: licence texts come from the crate sources in the local cargo registry.
# Order matters: for an `A OR B` crate the first accepted licence below is the one reproduced.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]
# Only what the shipped binary links: the workspace's own crates, build scripts and dev-dependencies are left out.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
# Windows is not a supported target.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
