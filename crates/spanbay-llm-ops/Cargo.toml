[package]
name = "spanbay-llm-ops"
description = "Provider sniffing, balance adapters, capture redaction and the SSRF-guarded HTTP transport."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes test doubles and fixtures to other crates' tests: `safe_http::scripted` and
# `ca_bundle::TEST_CA_PEM`; never enabled by a release build.
test-support = []
# release build.
[dependencies]
spanbay-base = { path = "../spanbay-base" }
spanbay-llm-domain = { path = "../spanbay-llm-domain" }
spanbay-llm-protocol = { path = "../spanbay-llm-protocol" }
spanbay-response = { path = "../spanbay-response" }
spanbay-model = { path = "../spanbay-model" }
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
memchr.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
