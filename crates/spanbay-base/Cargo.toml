[package]
name = "spanbay-base"
description = "Foundation of SpanBay: the error and secret contracts, platform paths and owner-only files, the diagnostic log, crypto, cancellation, ids and time, the SSRF guard, proxy URLs, URL encoding, regex, YAML reading and text diffs."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
[dependencies]
hmac.workspace = true
md-5.workspace = true
getrandom.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha1.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

# The `md-5` package exposes its library as `md5` (`use md5::Md5` in `src/crypto.rs`), which machete
# cannot map back to the package name.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[lib]
doctest = false
