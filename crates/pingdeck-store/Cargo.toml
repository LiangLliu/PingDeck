[package]
name = "pingdeck-store"
description = "SQLite schema ownership (single baseline schema, user_version = DDL fingerprint), typed workspace/agent/LLM repository, secret vault and attachment CAS."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes `*_for_test` helpers and test fixtures to other crates' tests; never enabled by a release build.
test-support = []

[dependencies]
pingdeck-base = { path = "../pingdeck-base" }
pingdeck-client-config = { path = "../pingdeck-client-config" }
pingdeck-llm-domain = { path = "../pingdeck-llm-domain" }
pingdeck-model = { path = "../pingdeck-model" }
flate2.workspace = true
memchr.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lib]
doctest = false
