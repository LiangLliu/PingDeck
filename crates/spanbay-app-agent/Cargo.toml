[package]
name = "spanbay-app-agent"
description = "Agent use-cases: chats, agent runs, MCP and skills, the agent tools over SpanBay data, and the aggregated AI config read."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
spanbay-base = { path = "../spanbay-base" }
spanbay-response = { path = "../spanbay-response" }
spanbay-model = { path = "../spanbay-model" }
spanbay-executor = { path = "../spanbay-executor" }
spanbay-store = { path = "../spanbay-store" }
spanbay-llm = { path = "../spanbay-llm" }
spanbay-agent = { path = "../spanbay-agent" }
spanbay-app = { path = "../spanbay-app" }
spanbay-app-llm = { path = "../spanbay-app-llm" }
base64.workspace = true
futures-util.workspace = true
ignore.workspace = true
memchr.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
flate2.workspace = true
spanbay-app = { path = "../spanbay-app", features = ["test-support"] }
spanbay-executor = { path = "../spanbay-executor", features = ["test-support"] }
spanbay-llm = { path = "../spanbay-llm", features = ["test-support"] }
spanbay-store = { path = "../spanbay-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
