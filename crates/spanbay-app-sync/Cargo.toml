[package]
name = "spanbay-app-sync"
description = "Folder sync and secret clean-up use-cases: the sync file format, merge rules and the auto-export job."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
spanbay-base = { path = "../spanbay-base" }
spanbay-model = { path = "../spanbay-model" }
spanbay-workbench = { path = "../spanbay-workbench" }
spanbay-llm = { path = "../spanbay-llm" }
spanbay-agent = { path = "../spanbay-agent" }
spanbay-app = { path = "../spanbay-app" }
spanbay-app-llm = { path = "../spanbay-app-llm" }
spanbay-app-agent = { path = "../spanbay-app-agent" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
spanbay-store = { path = "../spanbay-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
