[package]
name = "pingdeck-core"
description = "Desktop runtime assembly: post-paint startup and shutdown orchestration across the use-case crates, the facade the Tauri shell imports, and the cross-crate integration tests."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pingdeck-agent = { path = "../pingdeck-agent" }
pingdeck-app = { path = "../pingdeck-app" }
pingdeck-app-agent = { path = "../pingdeck-app-agent" }
pingdeck-app-llm = { path = "../pingdeck-app-llm" }
pingdeck-app-sync = { path = "../pingdeck-app-sync" }
pingdeck-base = { path = "../pingdeck-base" }
pingdeck-client-config = { path = "../pingdeck-client-config" }
pingdeck-executor = { path = "../pingdeck-executor" }
pingdeck-llm = { path = "../pingdeck-llm" }
pingdeck-model = { path = "../pingdeck-model" }
pingdeck-response = { path = "../pingdeck-response" }
pingdeck-store = { path = "../pingdeck-store" }
pingdeck-workbench = { path = "../pingdeck-workbench" }
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
pingdeck-app = { path = "../pingdeck-app", features = ["test-support"] }
pingdeck-executor = { path = "../pingdeck-executor", features = ["test-support"] }
pingdeck-llm = { path = "../pingdeck-llm", features = ["test-support"] }
pingdeck-store = { path = "../pingdeck-store", features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
test = false
