[package]
name = "spanbay-gpui"
description = "Pure-Rust GPU-accelerated desktop shell for SpanBay built on GPUI + gpui-kit, strictly isolated from core domain logic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "spanbay"
path = "src/main.rs"
test = false

[features]
default = []
test-support = ["gpui-kit/test-support"]

[lints]
workspace = true

[dependencies]
gpui-kit.workspace = true
spanbay-desktop = { path = "../spanbay-desktop" }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
tray-icon.workspace = true
