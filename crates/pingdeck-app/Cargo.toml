[package]
name = "pingdeck-app"
description = "The composition root (AppState) and the request, workspace, Flow, Mock, settings and system use-cases, and request code-snippet generation."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Never enabled by a release build.
test-support = []

[dependencies]
pingdeck-base = { path = "../pingdeck-base" }
pingdeck-response = { path = "../pingdeck-response" }
pingdeck-model = { path = "../pingdeck-model" }
pingdeck-executor = { path = "../pingdeck-executor" }
pingdeck-store = { path = "../pingdeck-store" }
pingdeck-workbench = { path = "../pingdeck-workbench" }
pingdeck-llm = { path = "../pingdeck-llm" }
pingdeck-agent = { path = "../pingdeck-agent" }
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
httpdate.workspace = true
percent-encoding.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
pingdeck-executor = { path = "../pingdeck-executor", features = ["test-support"] }
# The IPC contract test renders the DTOs with ts-rs: turn on `ts` for this crate and below.
pingdeck-llm = { path = "../pingdeck-llm", features = ["test-support"] }
pingdeck-store = { path = "../pingdeck-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
