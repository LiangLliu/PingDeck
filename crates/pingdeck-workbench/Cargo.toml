[package]
name = "pingdeck-workbench"
description = "API workbench engines: import and export (Postman, OpenAPI, HAR, cURL), the HTTP/1.1 Mock Server and the Flow runner."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pingdeck-base = { path = "../pingdeck-base" }
pingdeck-model = { path = "../pingdeck-model" }
pingdeck-executor = { path = "../pingdeck-executor" }
pingdeck-store = { path = "../pingdeck-store" }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
pingdeck-executor = { path = "../pingdeck-executor", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
