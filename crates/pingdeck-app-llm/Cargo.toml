[package]
name = "pingdeck-app-llm"
description = "LLM use-cases: providers, keys, models, aliases, the model catalog, the gateway, balance, usage and client-config writers."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pingdeck-base = { path = "../pingdeck-base" }
pingdeck-client-config = { path = "../pingdeck-client-config" }
pingdeck-model = { path = "../pingdeck-model" }
pingdeck-store = { path = "../pingdeck-store" }
pingdeck-llm = { path = "../pingdeck-llm" }
pingdeck-app = { path = "../pingdeck-app" }
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
pingdeck-llm = { path = "../pingdeck-llm", features = ["test-support"] }
pingdeck-store = { path = "../pingdeck-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lib]
doctest = false
