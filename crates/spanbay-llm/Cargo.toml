[package]
name = "spanbay-llm"
description = "The LLM layer: providers, the chat client, routing and failover, the local OpenAI-compatible gateway, protocol adapters, probes, balance and capture."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes the gateway, probe and `safe_http` test doubles, and the HealthBook test clock and probes
# of `spanbay-llm-domain`, to other crates' tests; never enabled by a release build.
test-support = ["spanbay-llm-ops/test-support", "spanbay-llm-domain/test-support"]
[dependencies]
spanbay-base = { path = "../spanbay-base" }
spanbay-model = { path = "../spanbay-model" }
spanbay-store = { path = "../spanbay-store" }
spanbay-llm-ops = { path = "../spanbay-llm-ops" }
spanbay-llm-domain = { path = "../spanbay-llm-domain" }
spanbay-llm-protocol = { path = "../spanbay-llm-protocol" }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
if-addrs.workspace = true
memchr.workspace = true
percent-encoding.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
spanbay-llm-ops = { path = "../spanbay-llm-ops", features = ["test-support"] }
spanbay-llm-domain = { path = "../spanbay-llm-domain", features = ["test-support"] }
spanbay-store = { path = "../spanbay-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lib]
doctest = false
